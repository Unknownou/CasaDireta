<!doctype html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F766E">
  <meta name="description" content="CasaDireta — Aluguer direto, sem intermediários e sem taxas de visita.">
  <title>CasaDireta</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Cpath d='M7 16 16 8l9 8v9h-6v-6h-6v6H7z' fill='%23fff'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind via CDN (sem instalação) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#0F766E', light: '#10B981', dark: '#115E59' },
            ink: '#0F172A',
            app: '#F8FAFC'
          },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>

  <!-- Ícones Lucide via CDN -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shell">
    <main id="view" aria-live="polite"></main>
    <div id="chrome"></div>
    <div id="sheet"></div>
    <div id="toast" role="status"></div>
  </div>
  <noscript>O CasaDireta precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
